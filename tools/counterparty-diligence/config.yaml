# counterparty-diligence M1 configuration.
# Weights, thresholds, throttling and TTLs live here, not in code (PRD FR5).

scoring:
  model_version: "v1"
  red_weight: -25        # mass address/director, npchk != 0, sanctions match, ...
  yellow_weight: -10
  plus_weight: 5
  plus_cap: 15           # positive contributions never exceed +15 total
  thresholds:
    green: 70            # score >= 70
    yellow: 40           # 40..69 yellow, < 40 red

throttling:
  egrul_min_interval_seconds: 30
  pb_min_interval_seconds: 5
  npchk_min_interval_seconds: 5
  sanctions_min_interval_seconds: 5
  http_timeout_seconds: 30

cache:
  facts_ttl_hours: 24
  db_path: "data/dd-cache.sqlite"

sanctions_lists:
  ofac_sdn:
    url: "https://sanctionslistservice.ofac.treas.gov/api/download/sdn.xml"
  eu_fsd:
    # webgate geoblocks bare /content URLs (403 from RU networks). The
    # token-suffixed distribution URL comes from the data.europa.eu catalog
    # ("Consolidated list of persons, groups and entities subject to EU
    # financial sanctions"). If it starts failing, take a fresh token from
    # the catalog or refresh the list manually via VPN/external host.
    url: "https://webgate.ec.europa.eu/fsd/fsf/public/files/xmlFullSanctionsList_1_1/content?token=dG9rZW4tMjAxNw"
  uk_oftsi:
    # gov.uk XML is discontinued; FCDO publishes the list as ODS.
    url: "https://sanctionslist.fcdo.gov.uk/docs/UK-Sanctions-List.ods"

http:
  # Respect or bypass ambient proxy env vars (PRD NFR "Сеть").
  trust_env: false

npchk:
  # npchk.nalog.ru TLS often fails behind intercepting proxies / on hosts
  # without the Russian CA chain in the trust store (verified live
  # 2026-10-17: CERTIFICATE_VERIFY_FAILED with and without a proxy).
  # direct_no_proxy: bypass HTTP(S)_PROXY env for npchk (default true).
  # verify_ssl: never set false silently — disables TLS verification!
  direct_no_proxy: true
  verify_ssl: false
